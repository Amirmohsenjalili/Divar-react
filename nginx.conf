server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/search {
        proxy_pass https://api.divar.ir/v8/postlist/w/search;
        proxy_ssl_server_name on;
        proxy_set_header Host api.divar.ir;
    }

    location /api/posts/ {
        proxy_pass https://api.divar.ir/v8/posts-v2/web/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.divar.ir;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
